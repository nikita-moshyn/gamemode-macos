name: PR Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths-ignore:
      - appcast.xml

concurrency:
  group: checks-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build
    # The pinned TCA packages require Swift 6.4 (Xcode 27).
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate release tooling
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/release.py validate-appcast appcast.xml

      - name: Build
        run: |
          xcodebuild \
            -project GameMode.xcodeproj \
            -scheme GameMode \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'platform=macOS' \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Run tests
        run: |
          xcodebuild \
            -project GameMode.xcodeproj \
            -scheme GameMode \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'platform=macOS' \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            test
