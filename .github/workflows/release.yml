name: Release
run-name: '${{ inputs.channel }} ${{ inputs.version }} — publish=${{ inputs.publish }}'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Base version (X.Y.Z, for example 0.2.0)'
        required: true
        type: string
      channel:
        description: Release channel
        required: true
        type: choice
        options: [beta, rc, stable]
        default: beta
      number:
        description: 'Beta/RC number (ignored for stable)'
        type: string
        default: '1'
      source_commit:
        description: 'Full 40-character source commit SHA (develop for beta/RC, main for stable)'
        required: true
        type: string
      publish:
        description: 'Publish GitHub release, tag, and Sparkle update'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Serialize tag/release/feed changes, including retries, without cancelling a publisher.
concurrency:
  group: gamemode-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build_version: ${{ steps.meta.outputs.build_version }}
      channel: ${{ steps.meta.outputs.channel }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - name: Require owner and trusted workflow branch
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$ACTOR" != "$OWNER" || "$TRIGGERING_ACTOR" != "$OWNER" || "$WORKFLOW_REF" != refs/heads/main ]]; then
            echo '::error::Run releases as the repository owner from the main workflow branch. Select source code with source_commit.'
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable source and release inputs
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          NUMBER: ${{ inputs.number }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python3 scripts/release.py prepare --version "$VERSION" --channel "$CHANNEL" \
            --number "$NUMBER" --commit "$SOURCE_COMMIT" --github-output "$GITHUB_OUTPUT"

  build:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: xcode-27
    environment: release
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - name: Checkout release tools from the workflow commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
      - name: Clear staging files left by an earlier runner job
        run: |
          rm -rf "$GITHUB_WORKSPACE/delivery"
          mkdir -p "$GITHUB_WORKSPACE/delivery"
      - name: Find an existing verified build
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 release-tools/scripts/release_delivery.py restore --directory delivery \
            --tag "$TAG" --commit "$SOURCE_COMMIT" --run-id "$GITHUB_RUN_ID" --github-output "$GITHUB_OUTPUT"
      - name: Restore this run's immutable artifact
        if: steps.restore.outputs.artifact_exists == 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.run_id }}
          path: delivery
      - name: Checkout the exact source commit
        if: steps.restore.outputs.restored != 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          path: source
          persist-credentials: false
      - name: Test, build, sign, and notarize
        if: steps.restore.outputs.restored != 'true'
        working-directory: source
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILD_VERSION: ${{ needs.prepare.outputs.build_version }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          export RELEASE_TOOLS="$GITHUB_WORKSPACE/release-tools"
          export RELEASE_DIRECTORY="$GITHUB_WORKSPACE/delivery"
          bash "$RELEASE_TOOLS/scripts/build_release.sh"
      - name: Verify release identity and archive
        run: |
          python3 release-tools/scripts/release_delivery.py verify --directory delivery --tag "$TAG" --commit "$SOURCE_COMMIT"
      - name: Save the completed release for retries and downloads
        if: steps.restore.outputs.artifact_exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.run_id }}
          path: |
            delivery/*.zip
            delivery/release.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Summarize build
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          {
            echo "### $TAG"
            echo "Source: $SOURCE_COMMIT"
            echo "Artifact: release-$GITHUB_RUN_ID (archive and release.json)"
            echo "Publish requested: $PUBLISH"
            echo 'Reruns reuse the saved archive. A new run with the same published version verifies and reuses its release assets.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: inputs.publish && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.run_id }}
          path: delivery
      - name: Publish or resume the exact release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo '::error::Configure RELEASE_PUBLISH_TOKEN in the release environment'; exit 1; }
          python3 scripts/release_delivery.py publish --directory delivery --tag "$TAG" --commit "$SOURCE_COMMIT"

  feed:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    environment: release
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
      - name: Verify the published archive before advertising it
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          python3 scripts/release_delivery.py download --directory delivery \
            --tag "$TAG" --commit "$SOURCE_COMMIT" --github-output "$GITHUB_OUTPUT"
      - name: Publish update feed
        env:
          ED_SIG: ${{ steps.release.outputs.signature }}
          LENGTH: ${{ steps.release.outputs.length }}
        run: bash scripts/publish_appcast.sh
