name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          TAG="${TAG_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (tag: $TAG)"

      # ── Import Developer ID certificate into a temporary keychain ──
      - name: Install signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          # Decode the certificate
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access the keychain without prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add temporary keychain to search list (prepend so it's found first)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          # Verify certificate is available
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Clean up the decoded file
          rm -f "$RUNNER_TEMP/certificate.p12"

      # ── Build with Developer ID signing ──
      - name: Build Release
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild \
            -project GameMode.xcodeproj \
            -scheme GameMode \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="$BUILD_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_VERSION" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build

      # ── Re-sign nested Sparkle binaries with Developer ID + timestamp ──
      - name: Package and sign app
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_PATH=$(find build/DerivedData -name "GameMode.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: GameMode.app not found in build output"
            exit 1
          fi

          cp -R "$APP_PATH" build/GameMode.app

          # Find the signing identity
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "Signing with: $IDENTITY"

          # Re-sign everything inside Sparkle.framework (inside-out order)
          # 1. Sign all standalone Mach-O binaries (like Autoupdate)
          find build/GameMode.app/Contents/Frameworks -type f -perm +111 | while read -r bin; do
            if file "$bin" | grep -q "Mach-O"; then
              echo "  Signing binary: $bin"
              codesign --force --sign "$IDENTITY" --timestamp --options runtime "$bin"
            fi
          done

          # 2. Sign all nested .app and .xpc bundles
          find build/GameMode.app/Contents/Frameworks -type d \( -name "*.app" -o -name "*.xpc" \) | while read -r nested; do
            echo "  Signing bundle: $nested"
            codesign --force --sign "$IDENTITY" --timestamp --options runtime "$nested"
          done

          # 3. Sign the Sparkle framework itself
          echo "  Signing Sparkle.framework..."
          codesign --force --sign "$IDENTITY" --timestamp --options runtime \
            build/GameMode.app/Contents/Frameworks/Sparkle.framework

          # Re-sign the main app (must be last)
          echo "  Signing GameMode.app..."
          codesign --force --sign "$IDENTITY" --timestamp --options runtime \
            --entitlements GameMode/GameMode.entitlements \
            build/GameMode.app

          # Verify the signature
          echo "==> Verifying code signature..."
          codesign --verify --deep --strict --verbose=2 build/GameMode.app
          echo "==> Signature OK"

      # ── Notarize with Apple ──
      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "==> Creating ZIP for notarization..."
          cd build
          ditto -c -k --keepParent GameMode.app "GameMode-${VERSION}.zip"
          cd ..

          echo "==> Submitting for notarization..."
          SUBMIT_OUTPUT=$(xcrun notarytool submit "build/GameMode-${VERSION}.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait \
            --timeout 600 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          # Extract submission ID
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')

          # Check if notarization succeeded
          if echo "$SUBMIT_OUTPUT" | grep -q "status: Invalid"; then
            echo "==> Notarization FAILED. Fetching rejection log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$TEAM_ID" \
              developer_log.json
            cat developer_log.json
            exit 1
          fi

          echo "==> Stapling notarization ticket..."
          xcrun stapler staple build/GameMode.app

          echo "==> Verifying notarization..."
          spctl --assess --type execute --verbose build/GameMode.app

          # Re-zip with the stapled ticket
          echo "==> Re-packaging with stapled ticket..."
          rm -f "build/GameMode-${VERSION}.zip"
          cd build
          ditto -c -k --keepParent GameMode.app "GameMode-${VERSION}.zip"
          cd ..

          echo "==> Notarization complete"

      # ── Sparkle EdDSA signature for auto-updates ──
      - name: Sign with Sparkle EdDSA
        id: sparkle_sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="build/GameMode-${VERSION}.zip"

          SIGN_TOOL="build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          if [ ! -f "$SIGN_TOOL" ]; then
            echo "ERROR: sign_update not found at $SIGN_TOOL"
            find build/DerivedData/SourcePackages -name "sign_update" -type f 2>/dev/null
            exit 1
          fi
          chmod +x "$SIGN_TOOL"

          SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_TOOL" "$ZIP" -f -)

          echo "Raw signature output: $SIGNATURE"

          ED_SIG=$(echo "$SIGNATURE" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)
          LENGTH=$(echo "$SIGNATURE" | grep -o 'length="[^"]*"' | cut -d'"' -f2)

          if [ -z "$ED_SIG" ]; then
            echo "ERROR: Failed to parse edSignature"
            exit 1
          fi

          echo "signature=$ED_SIG" >> "$GITHUB_OUTPUT"
          echo "length=$LENGTH" >> "$GITHUB_OUTPUT"
          echo "EdDSA signature: $ED_SIG (length: $LENGTH)"

      # ── Update appcast.xml for Sparkle auto-updates ──
      - name: Generate appcast.xml
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ED_SIG: ${{ steps.sparkle_sign.outputs.signature }}
          LENGTH: ${{ steps.sparkle_sign.outputs.length }}
        run: |
          DOWNLOAD_URL="https://github.com/nikita-moshyn/gamemode-macos/releases/download/${TAG}/GameMode-${VERSION}.zip"
          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")

          # Write the new item block to a temp file (avoids awk multi-line issues)
          cat > /tmp/new_item.xml << ITEM_EOF
              <item>
                  <title>Version ${VERSION}</title>
                  <sparkle:version>${VERSION}</sparkle:version>
                  <pubDate>${PUB_DATE}</pubDate>
                  <enclosure url="${DOWNLOAD_URL}" length="${LENGTH}" type="application/octet-stream" sparkle:edSignature="${ED_SIG}" />
                  <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
              </item>
          ITEM_EOF

          if [ -f appcast.xml ]; then
            # Insert new item after <language>en</language> line
            sed -i '' "/<language>en<\/language>/r /tmp/new_item.xml" appcast.xml
          else
            cat > appcast.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
              <channel>
                  <title>GameMode Changelog</title>
                  <description>Most recent changes with links to updates.</description>
                  <language>en</language>
          EOF
            cat /tmp/new_item.xml >> appcast.xml
            cat >> appcast.xml << EOF
              </channel>
          </rss>
          EOF
          fi

          rm -f /tmp/new_item.xml

          echo "--- appcast.xml ---"
          cat appcast.xml

      # ── Create GitHub Release ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GameMode ${{ steps.version.outputs.version }}
          body: |
            ## GameMode ${{ steps.version.outputs.version }}

            Download the zip, unzip, and drag GameMode.app to Applications.

            This build is signed with Developer ID and notarized by Apple.
          files: |
            build/GameMode-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false

      # ── Commit appcast.xml back to main ──
      - name: Commit appcast.xml to main
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the generated appcast
          cp appcast.xml /tmp/appcast.xml

          git fetch origin main
          git checkout main

          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          git diff --cached --quiet && echo "No appcast changes to commit" && exit 0

          git commit -m "chore: update appcast.xml for ${VERSION}"
          git push origin main

      # ── Cleanup keychain ──
      - name: Cleanup
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
