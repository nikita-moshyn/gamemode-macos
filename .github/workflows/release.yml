name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          TAG="${TAG_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION (tag: $TAG)"

      - name: Build Release
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild \
            -project GameMode.xcodeproj \
            -scheme GameMode \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            MARKETING_VERSION="$BUILD_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_VERSION" \
            build

      - name: Package app
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_PATH=$(find build/DerivedData -name "GameMode.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: GameMode.app not found in build output"
            exit 1
          fi

          cp -R "$APP_PATH" build/GameMode.app
          codesign --force --deep --sign - build/GameMode.app

          cd build
          ditto -c -k --keepParent GameMode.app "GameMode-${VERSION}.zip"

          echo "zip_path=build/GameMode-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "Packaged: build/GameMode-${VERSION}.zip"

      - name: Sign with Sparkle EdDSA
        id: sparkle_sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="build/GameMode-${VERSION}.zip"

          SIGN_TOOL="build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          if [ ! -f "$SIGN_TOOL" ]; then
            echo "ERROR: sign_update not found at $SIGN_TOOL"
            find build/DerivedData/SourcePackages -name "sign_update" -type f 2>/dev/null
            exit 1
          fi
          chmod +x "$SIGN_TOOL"

          SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_TOOL" "$ZIP" -f -)

          echo "Raw signature output: $SIGNATURE"

          ED_SIG=$(echo "$SIGNATURE" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)
          LENGTH=$(echo "$SIGNATURE" | grep -o 'length="[^"]*"' | cut -d'"' -f2)

          if [ -z "$ED_SIG" ]; then
            echo "ERROR: Failed to parse edSignature"
            exit 1
          fi

          echo "signature=$ED_SIG" >> "$GITHUB_OUTPUT"
          echo "length=$LENGTH" >> "$GITHUB_OUTPUT"
          echo "EdDSA signature: $ED_SIG (length: $LENGTH)"

      - name: Generate appcast.xml
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ED_SIG: ${{ steps.sparkle_sign.outputs.signature }}
          LENGTH: ${{ steps.sparkle_sign.outputs.length }}
        run: |
          DOWNLOAD_URL="https://github.com/nikita-moshyn/gamemode-macos/releases/download/${TAG}/GameMode-${VERSION}.zip"
          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")

          # Build the new item block
          read -r -d '' NEW_ITEM << ITEM_EOF || true
          <item>
                  <title>Version ${VERSION}</title>
                  <sparkle:version>${VERSION}</sparkle:version>
                  <pubDate>${PUB_DATE}</pubDate>
                  <enclosure url="${DOWNLOAD_URL}" length="${LENGTH}" type="application/octet-stream" sparkle:edSignature="${ED_SIG}" />
                  <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
              </item>
          ITEM_EOF

          if [ -f appcast.xml ]; then
            # Insert new item after <language>en</language> line
            awk -v item="$NEW_ITEM" '
              /<language>en<\/language>/ { print; print "        " item; next }
              { print }
            ' appcast.xml > appcast_tmp.xml
            mv appcast_tmp.xml appcast.xml
          else
            cat > appcast.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
              <channel>
                  <title>GameMode Changelog</title>
                  <description>Most recent changes with links to updates.</description>
                  <language>en</language>
                  ${NEW_ITEM}
              </channel>
          </rss>
          EOF
          fi

          echo "--- appcast.xml ---"
          cat appcast.xml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GameMode ${{ steps.version.outputs.version }}
          body: |
            ## GameMode ${{ steps.version.outputs.version }}

            Download the zip, unzip, and drag GameMode.app to Applications.

            **Note:** This build is ad-hoc signed. On first launch, right-click > Open to bypass Gatekeeper.
          files: |
            build/GameMode-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false

      - name: Commit appcast.xml to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the generated appcast
          cp appcast.xml /tmp/appcast.xml

          git fetch origin main
          git checkout main

          cp /tmp/appcast.xml appcast.xml
          git add appcast.xml
          git diff --cached --quiet && echo "No appcast changes to commit" && exit 0

          git commit -m "chore: update appcast.xml for ${VERSION}"
          git push origin main
        env:
          VERSION: ${{ steps.version.outputs.version }}
