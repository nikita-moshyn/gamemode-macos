name: Release

on:
  push:
    tags:
      # Stable: v0.1.0 or 0.1.0
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      # Beta: v0.2.0-beta.1
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.*'
      - '[0-9]+.[0-9]+.[0-9]+-beta.*'
      # RC: v0.2.0-rc.1
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.*'
      - '[0-9]+.[0-9]+.[0-9]+-rc.*'

permissions:
  contents: write

jobs:
  build-and-release:
    # The pinned TCA packages require Swift 6.4 (Xcode 27).
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # main's rulesets require an authorized account/app for feed pushes.
          token: ${{ secrets.RELEASE_PUBLISH_TOKEN || github.token }}

      - name: Require authorized feed publisher
        env:
          RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          if [ -z "$RELEASE_PUBLISH_TOKEN" ]; then
            echo "::error::Add RELEASE_PUBLISH_TOKEN as a repository Actions secret. Its account/app must be allowed to push to main under every active ruleset."
            exit 1
          fi

      # ── Parse tag into version, channel, and release flags ──
      - name: Extract version and channel
        id: meta
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          python3 scripts/release.py metadata "${TAG_REF#refs/tags/}" --github-output "$GITHUB_OUTPUT"

      - name: Validate release source branch
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git fetch origin main develop
          python3 scripts/release.py validate-source --tag "$TAG"

      - name: Validate release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Run Swift tests
        run: |
          xcodebuild \
            -project GameMode.xcodeproj \
            -scheme GameMode \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -destination 'platform=macOS' \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            test

      # ── Import Developer ID certificate into a temporary keychain ──
      - name: Install signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          rm -f "$RUNNER_TEMP/certificate.p12"

      # ── Build with Developer ID signing ──
      - name: Build Release
        env:
          BUILD_VERSION: ${{ steps.meta.outputs.version }}
          SPARKLE_BUILD_VERSION: ${{ steps.meta.outputs.build_version }}
        run: |
          xcodebuild \
            -project GameMode.xcodeproj \
            -scheme GameMode \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            MARKETING_VERSION="$BUILD_VERSION" \
            CURRENT_PROJECT_VERSION="$SPARKLE_BUILD_VERSION" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build

      # ── Sign all binaries with Developer ID + timestamp ──
      - name: Package and sign app
        id: package
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release/GameMode.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: GameMode.app not found in build output"
            exit 1
          fi

          cp -R "$APP_PATH" build/GameMode.app
          python3 scripts/release.py verify-bundle --app build/GameMode.app --tag "$TAG"

          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "Signing with: $IDENTITY"

          # 1. Sign all standalone Mach-O binaries (like Autoupdate)
          find build/GameMode.app/Contents/Frameworks -type f -perm +111 | while read -r bin; do
            if file "$bin" | grep -q "Mach-O"; then
              echo "  Signing binary: $bin"
              codesign --force --sign "$IDENTITY" --timestamp --options runtime "$bin"
            fi
          done

          # 2. Sign all nested .app and .xpc bundles
          find build/GameMode.app/Contents/Frameworks -type d \( -name "*.app" -o -name "*.xpc" \) | while read -r nested; do
            echo "  Signing bundle: $nested"
            codesign --force --sign "$IDENTITY" --timestamp --options runtime "$nested"
          done

          # 3. Sign the Sparkle framework
          echo "  Signing Sparkle.framework..."
          codesign --force --sign "$IDENTITY" --timestamp --options runtime \
            build/GameMode.app/Contents/Frameworks/Sparkle.framework

          # 4. Sign the main app (must be last)
          echo "  Signing GameMode.app..."
          codesign --force --sign "$IDENTITY" --timestamp --options runtime \
            --entitlements GameMode/GameMode.entitlements \
            build/GameMode.app

          echo "==> Verifying code signature..."
          codesign --verify --deep --strict --verbose=2 build/GameMode.app
          echo "==> Signature OK"

      # ── Notarize with Apple ──
      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo "==> Creating ZIP for notarization..."
          cd build
          ditto -c -k --keepParent GameMode.app "GameMode-${VERSION}.zip"
          cd ..

          echo "==> Submitting for notarization..."
          SUBMIT_OUTPUT=$(xcrun notarytool submit "build/GameMode-${VERSION}.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait \
            --timeout 600 2>&1) || true

          echo "$SUBMIT_OUTPUT"

          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')

          if echo "$SUBMIT_OUTPUT" | grep -q "status: Invalid"; then
            echo "==> Notarization FAILED. Fetching rejection log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$TEAM_ID" \
              developer_log.json
            cat developer_log.json
            exit 1
          fi

          echo "==> Stapling notarization ticket..."
          xcrun stapler staple build/GameMode.app

          echo "==> Verifying notarization..."
          spctl --assess --type execute --verbose build/GameMode.app

          echo "==> Re-packaging with stapled ticket..."
          rm -f "build/GameMode-${VERSION}.zip"
          cd build
          ditto -c -k --keepParent GameMode.app "GameMode-${VERSION}.zip"
          cd ..

          echo "==> Notarization complete"

      # ── Sparkle EdDSA signature for auto-updates ──
      - name: Sign with Sparkle EdDSA
        id: sparkle_sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          ZIP="build/GameMode-${VERSION}.zip"

          SIGN_TOOL="build/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          if [ ! -f "$SIGN_TOOL" ]; then
            echo "ERROR: sign_update not found at $SIGN_TOOL"
            find build/DerivedData/SourcePackages -name "sign_update" -type f 2>/dev/null
            exit 1
          fi
          chmod +x "$SIGN_TOOL"

          SIGNATURE=$(echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_TOOL" "$ZIP" -f -)

          echo "Raw signature output: $SIGNATURE"

          ED_SIG=$(echo "$SIGNATURE" | grep -o 'sparkle:edSignature="[^"]*"' | cut -d'"' -f2)
          LENGTH=$(echo "$SIGNATURE" | grep -o 'length="[^"]*"' | cut -d'"' -f2)

          if [ -z "$ED_SIG" ]; then
            echo "ERROR: Failed to parse edSignature"
            exit 1
          fi

          PUBLIC_KEY=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' build/GameMode.app/Contents/Info.plist)
          swift scripts/verify_update.swift "$ZIP" "$ED_SIG" "$PUBLIC_KEY" "$LENGTH"

          echo "signature=$ED_SIG" >> "$GITHUB_OUTPUT"
          echo "length=$LENGTH" >> "$GITHUB_OUTPUT"
          echo "EdDSA signature: $ED_SIG (length: $LENGTH)"

      # ── Create GitHub Release ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.display_name }}
          body: |
            ## ${{ steps.meta.outputs.display_name }}

            Download the zip, unzip, and drag GameMode.app to Applications.

            Signed with Developer ID and notarized by Apple.
          files: |
            build/GameMode-${{ steps.meta.outputs.version }}.zip
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'false' }}

      # Publish only after the signed archive is available for download.
      # Every release changes only the feed; code promotion happens through PRs.
      - name: Publish update feed
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          ED_SIG: ${{ steps.sparkle_sign.outputs.signature }}
          LENGTH: ${{ steps.sparkle_sign.outputs.length }}
        run: |
          bash scripts/publish_appcast.sh

      # ── Cleanup keychain ──
      - name: Cleanup
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
